radius);padding:28px;margin-bottom:20px}.hero{background:linear-gradient(120deg,#191919,#464644);color:white;padding:32px;border-radius:var(--radius);margin-bottom:20px}.hero p{color:#efefef}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:20px}.full{grid-column:1/-1}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.metric{background:#fff9;padding:20px;border-radius:22px}.metric strong{display:block;font-size:28px}.metric span{font-size:12px;font-weight:700;color:var(--muted)}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap}.toolbar{display:flex;gap:12px;margin:22px 0}.toolbar input{flex:1}.toolbar select{max-width:220px}.field{min-width:0}.field label{font-size:12px;font-weight:750;display:block;margin-bottom:7px}.field small{display:block;margin-top:7px}input,select,textarea{width:100%;border:1px solid #d8d6d1;border-radius:15px;background:#ffffffd9;min-height:48px;padding:10px 14px;color:#222}input::placeholder,textarea::placeholder{color:#68655f}textarea{min-height:108px;resize:vertical}input[type=checkbox],input[type=radio]{width:18px;min-height:18px;accent-color:#222;vertical-align:middle;margin-right:7px}.disabled{opacity:.5}.disabled input,.disabled select{background:#ebe9e5}.measure{display:grid;grid-template-columns:1fr 100px;gap:10px}.empty{padding:38px 24px;text-align:center;border:1px dashed #d5d1ca;border-radius:20px}.empty p{margin:8px auto 22px}.notice{padding:18px 20px;border-radius:16px;background:#e9f6ed;border:1px solid #b9ddc4;margin-bottom:20px}.notice.error{background:#fbecef;border-color:#eac3cb;color:#861d36}.notice.warn{background:#fff6de;border-color:#e6d399;color:#6c511c}.section{border-top:1px solid var(--line);padding-top:24px;margin-top:24px}.summary{display:flex;gap:32px;flex-wrap:wrap;margin:20px 0}.summary dt{font-size:12px;color:var(--muted)}.summary dd{margin:2px 0;font-weight:700}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}th,td{padding:17px 12px;border-bottom:1px solid #e4dfd7}td small{display:block}.stack>*+*{margin-top:18px}.item{border-bottom:1px solid var(--line);padding:18px 0}.item:first-child{padding-top:0}.item:last-child{border:0}.timeline{padding-left:20px}.timeline li{padding:0 0 20px 8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tabs a{padding:10px 15px;border-radius:10px;text-decoration:none}.tabs a.active{background:#e5e0d6;font-weight:700}.mobile-orders{display:none}.dialog-bg{position:fixed;inset:33px 0 0;background:#151515b3;display:grid;place-items:center;padding:20px;z-index:10}.dialog{background:white;border-radius:26px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:28px;box-shadow:0 22px 70px #0004}.dialog.small{max-width:550px}.popover{max-width:430px;background:#202020;color:white;padding:24px;border-radius:22px}.popover p,.popover small{color:#d6d6d6}.auth{max-width:530px;margin:36px auto;background:#202020;color:white;padding:32px;border-radius:28px}.auth p,.auth small{color:#d6d6d6}.auth label{color:white}.auth .field{margin-bottom:16px}.auth .button{background:#eee;color:#111;width:100%}.auth a:not(.button){color:white}.wordmark{font-size:35px;font-weight:800;letter-spacing:-.04em;margin-bottom:15px}.wordmark small{font-size:14px;letter-spacing:.12em;font-weight:400}.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.catalog a{display:block;background:#fff;padding:20px;border-radius:16px;text-decoration:none}.catalog small{display:block}.prototype-note{font-size:12px;color:var(--muted);margin-top:16px}.statusbox{padding:18px;background:#efede8;border-radius:16px;margin:12px 0}.link{background:none;color:#222;padding:0;min-height:0;text-decoration:underline}.hidden{display:none!important}

<script>
const qs=new URLSearchParams(location.search),screen=qs.get('screen')||'catalog';
const screens=['admin-orders','admin-detail','admin-customers','admin-customer','admin-audit','admin-notifications','admin-status','admin-quote','admin-conflict','login','register-base','register-tax-exempt','verification-modal','forgot-password','dashboard-empty','dashboard-draft','new-order-empty','new-order-roller','new-order-zebra','new-order-ripple-fold','new-order-pinch-pleat','new-order-roman-shades','new-order-other','new-order-no-track','snaps-suggestion','order-multiple-models','order-review','history-empty','history-filters','profile','profile-sms-prompt','notifications','draft-conflict','form-error'];
const labels={'admin-orders':'Orders','admin-detail':'Order DEMO-1002','admin-customers':'Customers','admin-customer':'Atelier Demo','admin-audit':'Activity log','admin-notifications':'Notifications','admin-status':'Change order status','admin-quote':'Prepare quote','admin-conflict':'Resolve version conflict'};
const url=s=>'?screen='+s, link=(s,t,cls='secondary')=>`<a class="button ${cls}" href="${url(s)}">${t}</a>`;
const button=t=>`<button type="button" onclick="document.getElementById('feedback').textContent='Reference only — no data is saved.'">${t}</button>`;
const field=(label,value='',disabled=false,options=null)=>`<div class="field ${disabled?'disabled':''}"><label>${label}${options?`<select ${disabled?'disabled':''}>${options.map(o=>`<option ${o===value?'selected':''}>${o}</option>`).join('')}</select>`:`<input ${disabled?'disabled':''} value="${value}" placeholder="${disabled?'Not applicable':'Enter value'}">`}</label></div>`;
const note=(title,body,type='')=>`<div class="notice ${type}"><strong>${title}</strong><div>${body}</div></div>`;
const statuses=['Received','In Production','Ready for Installation','Delivered','Cancelled'];
const orders=[['DEMO-1002','Atelier Demo','Ocean residence','In Production','2 models · 3 curtains'],['DEMO-1003','Studio Example','Lobby west','Received','1 model · 2 curtains'],['DEMO-1001','Atelier Demo','Garden room','Ready for Installation','3 models · 4 curtains']];
function badge(s){return `<span class="badge ${s==='In Production'?'blue':s==='Ready for Installation'||s==='Delivered'?'green':s==='Cancelled'?'red':''}">${s}</span>`}
function nav(admin){return `<nav aria-label="Main navigation">${(admin?[['admin-orders','Orders'],['admin-customers','Customers'],['admin-audit','Activity'],['admin-notifications','Notifications']]:[['dashboard-draft','Dashboard'],['new-order-empty','New Order'],['history-empty','Order History'],['profile','My Profile']]).map(([s,t])=>`<a class="${screen===s?'active':''}" href="${url(s)}">${t}</a>`).join('')}</nav>`}
function shell(title,subtitle,content,admin=false){return `<div class="wrap"><header><div><h1>${title}</h1><p class="muted">${subtitle}</p></div>${nav(admin)}</header>${content}<p id="feedback" role="status" class="prototype-note">${admin?'INFERRED ADMIN TARGET · structure proposed from client evidence.':'Synthetic reconstruction from observed labels and rules; not an original screenshot.'}</p></div>`}
function orderRows(){return `<div class="desktop-orders table-wrap"><table><thead><tr><th>Order</th><th>Customer / sidemark</th><th>Submitted</th><th>Models</th><th>Status</th><th></th></tr></thead><tbody>${orders.map(o=>`<tr><td><strong>${o[0]}</strong></td><td>${o[1]}<small>${o[2]}</small></td><td>Sep 13, 2026</td><td>${o[4]}</td><td>${badge(o[3])}</td><td>${link('admin-detail','Open')}</td></tr>`).join('')}</tbody></table></div><div class="mobile-orders">${orders.map(o=>`<article class="item"><div class="row"><strong>${o[0]}</strong>${badge(o[3])}</div><p>${o[1]}<br><span class="muted">${o[2]} · ${o[4]}</span></p>${link('admin-detail','Open order')}</article>`).join('')}</div>`}
function modelSummary(){return `<article class="item"><div class="row"><h3>Living room · Ripple Fold</h3><span class="badge">Qty 2</span></div><dl class="summary"><div><dt>Fabric</dt><dd>Demo Linen 01</dd></div><div><dt>Width × height</dt><dd>100 × 84 in</dd></div><div><dt>Opening / fullness</dt><dd>C/O · 100%</dd></div><div><dt>Snaps · automatic</dt><dd>27 / 27</dd></div></dl><p class="muted">White track · Ceiling · Manual · Track supplied by LUX</p></article><article class="item"><div class="row"><h3>Bedroom · Roman Shades</h3><span class="badge">Qty 1</span></div><dl class="summary"><div><dt>Fabric</dt><dd>Demo Linen 02</dd></div><div><dt>Width × height</dt><dd>48 1/2 × 72 in</dd></div><div><dt>Operation</dt><dd>Cord · Right</dd></div></dl><p class="muted">IB installation · Snaps, fullness and opening not applicable</p></article>`}
function adminDetail(){return `<div class="row"><div class="actions">${link('admin-orders','← All orders')}${badge('In Production')}</div><div class="actions">${link('admin-status','Change status','')}${link('admin-quote','Prepare quote')}</div></div><dl class="summary"><div><dt>Customer</dt><dd>Atelier Demo</dd></div><div><dt>Sidemark</dt><dd>Ocean residence</dd></div><div><dt>Submitted</dt><dd>Sep 13, 2026</dd></div><div><dt>Revision</dt><dd>3</dd></div></dl><div class="split"><div><section class="card"><div class="row"><h2>Models & measurements</h2>${button('Edit models')}</div>${modelSummary()}</section><section class="card"><h2>Files</h2><div class="item row"><div><strong>measurement-demo.pdf</strong><small class="muted"> · PDF · 240 KB · Clean</small></div>${button('Download')}</div><div class="item row"><div><strong>window-demo.png</strong><small class="muted"> · Image · 84 KB · Clean</small></div>${button('Preview')}</div><small>Private files · access checked before download.</small></section></div><aside><section class="card"><h2>Internal notes</h2><p class="muted">Visible to staff only.</p><p>Demo note: review the track finish before production.</p><label>New note<textarea placeholder="Write an internal note..."></textarea></label><div class="actions">${button('Add note')}</div></section><section class="card"><h2>Quote</h2><p>No published quote.</p><p class="muted">Manual pricing. Currency and amount must be confirmed before publishing.</p>${link('admin-quote','Prepare quote')}</section><section class="card"><h2>Recent activity</h2><ol class="timeline"><li><strong>In Production</strong><br><small>Demo Operator · Today, 10:30</small></li><li><strong>Models reviewed</strong><br><small>Revision 3 · Today, 10:20</small></li><li><strong>Order received</strong><br><small>Demo Customer · Today, 09:00</small></li></ol>${link('admin-audit','View full history')}</section></aside></div>`}
function admin(){let content='';if(screen==='admin-orders'){content=`<div class="hero"><div class="row"><div><h2>Every order, ready for the next step.</h2><p>Review measurements, coordinate production and keep customers informed.</p></div><span class="badge">3 demo orders</span></div></div><section class="card"><div class="row"><h2>All orders</h2><span class="muted">3 results</span></div><div class="toolbar"><input aria-label="Search orders" placeholder="Search order number, customer or sidemark"><select aria-label="Status"><option>All statuses</option>${statuses.map(s=>`<option>${s}</option>`).join('')}</select>${button('Filter')}</div>${orderRows()}<div class="row section"><small>Showing 1–3 of 3</small><div class="actions"><button class="secondary" disabled>Previous</button><button class="secondary" disabled>Next</button></div></div></section>`}
else if(screen==='admin-detail')content=adminDetail();
else if(screen==='admin-customers')content=`<section class="card"><h2>Customers</h2><div class="toolbar"><input aria-label="Search customers" placeholder="Search company or contact">${button('Search')}</div>${['Atelier Demo','Studio Example'].map((n,i)=>`<article class="item row"><div><h3>${n}</h3><p class="muted">${i?'Second':'Primary'} demo contact · contact${i+1}@example.test</p><span class="badge">${i?1:2} orders</span></div>${link('admin-customer','Open customer')}</article>`).join('')}</section>`;
else if(screen==='admin-customer')content=`<div class="split"><section class="card"><h2>Company & contact</h2><dl class="summary"><div><dt>Company</dt><dd>Atelier Demo</dd></div><div><dt>Contact</dt><dd>Demo Contact</dd></div><div><dt>Email</dt><dd>customer@example.test</dd></div></dl><h3>Orders</h3>${orderRows()}</section><aside class="card"><h2>Tax documentation</h2><p>${badge('Received')}</p><p>Certificate awaiting review.</p>${button('View demo certificate')}<div class="section"><label>Review reason<textarea placeholder="Record the decision..."></textarea></label><div class="actions">${button('Approve')}${button('Reject')}</div><small>Administrator permission required.</small></div></aside></div>`;
else if(screen==='admin-audit')content=`<section class="card"><h2>Audit trail</h2><p class="muted">Changes are recorded with actor, timestamp, revision and reason.</p><div class="toolbar"><input aria-label="Resource" placeholder="Order or customer ID"><select aria-label="Action"><option>All actions</option><option>Status changed</option><option>Order corrected</option></select>${button('Filter')}</div><ol class="timeline"><li><strong>DEMO-1002 · Status changed</strong><p>Received → In Production</p><small>Demo Operator · Sep 13, 10:30 · Revision 3</small></li><li><strong>DEMO-1002 · Model corrected</strong><p>Height: 83 → 84 in. Reason: measurement confirmed.</p><small>Demo Operator · Sep 13, 10:20 · Revision 2 → 3</small></li><li><strong>DEMO-1002 · Submitted</strong><p>2 models · 3 curtains.</p><small>Demo Customer · Sep 13, 09:00</small></li></ol></section>`;
else if(screen==='admin-notifications')content=`<section class="card"><div class="row"><h2>Notifications</h2><div class="actions">${button('Mark all as read')}${button('Clear read')}</div></div><article class="item"><span class="badge green">Unread</span><h3>New order DEMO-1003</h3><p>Studio Example submitted 1 model for review.</p>${link('admin-detail','Open order')}</article><article class="item"><h3>DEMO-1002 updated</h3><p class="muted">Measurements were reviewed. Revision 3 is available.</p></article></section>`;
else{let inner='';if(screen==='admin-status')inner=`<h2>Change order status</h2><p>DEMO-1002 · Revision 3</p>${field('Current status','In Production',true)}${field('New status','Ready for Installation',false,['Ready for Installation','Cancelled'])}<label>Reason<textarea placeholder="Add production or cancellation details..."></textarea></label><p class="muted">The change will be recorded and a customer notification queued.</p><div class="actions">${link('admin-detail','Cancel')}${button('Confirm status')}</div>`;
if(screen==='admin-quote')inner=`<h2>Prepare quote</h2><p>DEMO-1002 · Manual quote</p><div class="grid">${field('Currency','USD')}${field('Amount','0.00')}</div><label>Quote notes<textarea placeholder="Explain the confirmed amount..."></textarea></label>${note('No automatic tax calculation','Confirm amount and currency before publishing.','warn')}<div class="actions">${link('admin-detail','Cancel')}${button('Save draft')}${button('Publish quote')}</div>`;
if(screen==='admin-conflict')inner=`<h2>A newer version is available</h2>${note('Your changes were not saved','You edited revision 3. The current server revision is 4.','error')}<p>Review the latest measurements before applying your correction.</p><div class="actions">${link('admin-detail','Load latest version','')}${button('Keep my text for comparison')}</div>`;content=adminDetail()+`<div class="dialog-bg"><section role="dialog" aria-modal="true" aria-label="${labels[screen]}" class="dialog small">${inner}</section></div>`}return shell(labels[screen],'LUX Blinds · Administration',content,true)}
function builder(){let type=({'new-order-roller':'Roller','new-order-zebra':'Zebra','new-order-ripple-fold':'Ripple Fold','new-order-pinch-pleat':'Pinch Pleat','new-order-roman-shades':'Roman Shades','new-order-other':'Other','new-order-no-track':'Ripple Fold','snaps-suggestion':'Ripple Fold'})[screen]||'Select';const blank=type==='Select',noTrack=screen==='new-order-no-track',roman=type==='Roman Shades',pinch=type==='Pinch Pleat',snap=!['Roller','Zebra','Pinch Pleat','Roman Shades'].includes(type),supplyChoice=!['Roller','Zebra','Roman Shades'].includes(type);return `<section class="card">${screen==='draft-conflict'?note('A newer server draft exists','Your local revision is 2. Server revision is 3. Reload and compare before saving.','warn'):screen==='form-error'?note('Please complete the highlighted fields','Fabric Name and Width are required.','error'):note('Draft preview','Synthetic state only. No information is saved.')}<div class="grid">${field('SIDEMARK *',blank?'':'DEMO-001')}</div><div class="section"><h2>Add Curtain / Model</h2><div class="grid">${field('Room / Area',blank?'':'Living room')}${field('Product Type *',type,false,['Select','Roller','Zebra','Ripple Fold','Pinch Pleat','Roman Shades','Other'])}${type==='Other'?field('Write product type *','Custom Demo'):''}${field('Fabric Name *',blank?'':'Demo Linen 01')}${field('Width *',blank?'':'100')}${field('Height *',blank?'':'84')}${snap?field('Snaps',screen==='snaps-suggestion'?'':'',false):''}${snap?'<small class="full">'+(screen==='snaps-suggestion'?'Suggested: 27 / 27 — leave Snaps blank to use this automatically.':'Suggested snaps require Width, Open Direction and Fullness.')+'</small>':''}${field('Open Direction *',blank?'Select':'C/O',roman,['Select','C/O','O/W L','O/W R','Crazy Track. O/W','Crazy Track . C/O'])}${supplyChoice?field('Will Lux Blinds supply the track? *',noTrack?'No':'Yes',false,['Yes','No']):''}${field('Track *',blank?'Select':'White',roman||noTrack,['Select','White','Black','Rod','Other'])}${field('Fullness *',blank?'Select':'100%',roman||pinch||noTrack,['Select','120%','100%','80%'])}${field('Installation *',blank?'Select':roman?'IB':'Ceiling',noTrack,['Select','Ceiling','Wall','IB','OB'])}${field('Control Side *',blank?'Select':'Right',pinch||type==='Ripple Fold'||noTrack,['Select','Left','Right'])}${field('Manual / Motorized / Cord *',blank?'Select':'Manual',noTrack,['Select','Manual','Motorized','Cord'])}<div class="field full"><label>Notes for this Curtain / Model<textarea placeholder="Write instructions that apply only to this curtain..."></textarea></label></div></div><div class="actions">${link('order-multiple-models','Add Curtain to Order','')}${link('new-order-empty','Clear Form')}</div></div><div class="section"><h2>General Details</h2><label>Special Notes<textarea placeholder="Write any special instructions here..."></textarea></label><div class="statusbox"><strong>Upload Photos</strong><p class="muted">Demo image · selected for reference</p>${button('Choose files')}</div>${link('order-review','Review Order','')}</div></section>`}
function auth(){const register=screen.startsWith('register'),tax=screen==='register-tax-exempt',forgot=screen==='forgot-password',verify=screen==='verification-modal';return `<section class="auth"><div class="wordmark">LUX <small>BLINDS</small></div><h1>${register?'Create Account':forgot?'Forgot Password?':verify?'Verify your account':'LUX Blinds Portal'}</h1><p>${register?'Register your company to submit and track orders.':forgot?'Enter your email and we will send you a secure link to create a new password.':verify?'Enter the code sent to customer@example.test.':'Manage your custom blinds and curtain orders.'}</p>${register?field('Company Name','')+field('Contact Name',''):''}${!verify?field('Email Address',''):field('Verification code','')}${register?field('Phone Number','')+'<label><input type="radio" checked name="method">Email</label> <label><input type="radio" name="method">Text Message (SMS)</label>'+field('Company Tax ID (optional)',''):''}${!forgot&&!verify?'<div class="field"><label>Password<input type="password" placeholder="Enter your password"></label></div>':''}${register?'<div class="field"><label>Confirm Password<input type="password"></label></div><p>Are you tax exempt?</p><label><input type="radio" name="tax" '+(tax?'checked':'')+'>Yes</label> <label><input type="radio" name="tax" '+(!tax?'checked':'')+'>No</label>'+ (tax?'<div class="statusbox" style="color:#171717">Tax Exemption / Resale Certificate<br><small style="color:#595650">PDF, JPG, PNG · required</small></div>':'')+'<p><label><input type="checkbox">I agree to the Terms & Conditions and acknowledge the Privacy Policy.</label></p><p><label><input type="checkbox">I agree to receive automated SMS about my account and orders.</label></p>':''}${link(verify?'dashboard-empty':register?'verification-modal':forgot?'forgot-password':'dashboard-draft',verify?'Confirm Code':register?'Create Account':forgot?'Send Reset Link':'Sign In','')}<p style="margin-top:18px">${verify?'<a href="?screen=verification-modal">Resend Code</a> · <a href="?screen=register-base">Change Email</a>':`<a href="?screen=register-base">Create a new account</a><br><a href="?screen=forgot-password">Forgot your password?</a>`}</p><small>MOCK DATA · no form submits or messages. Photo background asset pending; use original login capture for image placement.</small></section>`}
function client(){let content='',title='New Order',sub='Add one or multiple curtains/models to the same order.';if(screen.startsWith('dashboard')){title='Client Dashboard';sub='Welcome, Demo Contact';content=`<div class="hero"><h2>Manage your orders in one place.</h2><p>Submit new orders, review recent activity and check production status.</p><div class="actions">${link('new-order-empty','+ New Order','')}${link('history-empty','Order History')}</div></div>${screen==='dashboard-draft'?'<section class="card"><div class="row"><div><span class="badge green">Saved draft</span><h3>Continue your unfinished order</h3><span class="muted">2 added models</span></div>'+link('order-multiple-models','Continue Draft','')+'</div></section>':''}<div class="metrics">${['Total orders','Received','In Production','Completed'].map(t=>`<div class="metric"><span>${t}</span><strong>0</strong></div>`).join('')}</div><section class="card"><h2>Recent Orders</h2><div class="empty"><h3>No orders yet.</h3><p>Create your first order and it will appear here with its status and details.</p>${link('new-order-empty','+ New Order','')}</div></section>`}
else if(screen.startsWith('history')){title='Order History';sub='View, search and track your submitted orders.';content=`<section class="card"><div class="row"><h2>All Orders</h2>${link('new-order-empty','+ New Order','')}</div><p class="muted">Use filters to find an order quickly.</p><div class="toolbar"><input aria-label="Search" placeholder="Search by order number or sidemark"><select aria-label="Status"><option>All Statuses</option>${statuses.map(s=>`<option>${s}</option>`).join('')}</select>${button('Filter')}</div>${screen==='history-filters'?'<div class="tabs">'+statuses.map(badge).join('')+'</div>':''}<div class="empty"><h3>No orders yet.</h3><p>Create your first order and it will appear here with its status and details.</p>${link('new-order-empty','+ New Order','')}</div></section>`}
else if(screen.startsWith('profile')||screen==='notifications'){title='My Profile';sub='Manage your customer account and contact information.';content=`<div class="split"><section class="card"><div class="grid">${field('Company Name *','Demo Company')}${field('Contact Name *','Demo Contact')}${field('Email *','customer@example.test')}${field('Phone *','[synthetic phone]')}<div class="full field"><label>Address<textarea>Demo address — not a real location</textarea></label></div></div><div class="section"><h2>Change Password</h2><p class="muted">Leave these fields blank if you do not want to change it.</p><div class="grid">${field('Current Password')}${field('New Password')}${field('Confirm New Password')}</div></div><div class="section"><h2>Tax Exempt Certificate</h2><p>Demo certificate · no real document</p>${button('Choose file')}<p class="muted">PDF, JPG, PNG or WebP. Maximum 10 MB.</p>${button('Save Profile')}</div></section><aside class="card"><h2>Account</h2><div class="statusbox">Email<strong style="display:block">Verified</strong></div><div class="statusbox">SMS Notifications<strong style="display:block">Off</strong><p>Consent is optional.</p>${button('Activate SMS')}</div><div class="statusbox">Tax status<strong style="display:block">Pending review</strong></div><p class="muted">Tax status and account permissions can only be changed by Lux Blinds.</p></aside></div>`;if(screen==='profile-sms-prompt')content+=`<div class="dialog-bg"><section role="dialog" aria-modal="true" class="dialog small"><h2>Would you like SMS order notifications?</h2><p>Receive important updates about your account and orders.</p><p><label><input type="checkbox">I agree to receive automated SMS from LUX Blinds about my account and orders.</label></p><div class="actions">${button('Activate SMS Notifications')}${link('profile','Not Now')}</div></section></div>`;if(screen==='notifications')content+=`<div class="dialog-bg"><section role="dialog" aria-modal="true" class="popover"><h3>Notifications</h3><small>Updates about your orders</small><p class="section">No notifications yet.</p><div class="actions">${button('Mark all as read')}${button('Clear read')}${link('dashboard-empty','Dashboard')}</div></section></div>`}
else if(screen==='order-multiple-models'||screen==='order-review'){content=`<section class="card"><div class="row"><h2>DEMO-001</h2><span class="badge">2 models · 3 curtains</span></div>${modelSummary()}<div class="actions">${link('new-order-ripple-fold','Edit model')}${button('Remove model')}${link('order-review','Review Order','')}</div></section>`;if(screen==='order-review')content+=`<div class="dialog-bg"><section role="dialog" aria-modal="true" aria-label="Review order" class="dialog"><h2>Review Order</h2><dl class="summary"><div><dt>Sidemark</dt><dd>DEMO-001</dd></div><div><dt>Models</dt><dd>2</dd></div><div><dt>Total Quantity</dt><dd>3</dd></div></dl>${modelSummary()}<p>Uploaded Photos: 1 synthetic file</p><p>Special Notes: No special notes</p><div class="actions">${link('order-multiple-models','Back to edit')}${button('Submit Order')}</div><small>No order will be sent from this reference.</small></section></div>`}
else content=builder();return shell(title,sub,content)}
document.getElementById('app').innerHTML=screen==='catalog'?shell('Reference studio','LUX Blinds · synthetic client states and inferred admin target',`<section class="card"><h2>Admin target A · continuous portal identity</h2><p>One complete direction. Orders, customer records, detail, files, notes, quotes and audit. Desktop table becomes mobile cards.</p>${link('admin-orders','Explore admin target','')}</section><div class="catalog">${screens.filter(s=>s!=='catalog').map(s=>`<a href="${url(s)}"><strong>${labels[s]||s.replaceAll('-',' ')}</strong><small>${s.startsWith('admin')?'INFERRED ADMIN':'SYNTHETIC CLIENT'} · MOCK DATA</small></a>`).join('')}</div>`):screen.startsWith('admin')?admin():['login','register-base','register-tax-exempt','verification-modal','forgot-password'].includes(screen)?auth():client();
document.addEventListener('submit',e=>e.preventDefault());
</script></body></html>
